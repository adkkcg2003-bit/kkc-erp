# nixpacks.toml - Railway build config
[phases.setup]
nixPkgs = ['python312']

[phases.build]
dependsOn = ['setup']
cmds = [
  'pip install -r requirements.txt --no-cache-dir',
  'python manage.py collectstatic --noinput --clear'
]

[start]
cmd = 'gunicorn kkc_erp.wsgi:application --bind 0.0.0.0:$PORT'